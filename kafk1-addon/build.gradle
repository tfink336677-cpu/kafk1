plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.kafk1.addon'

base {
    archivesName = 'kafk1-addon'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "kafk1" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// Для теста вместе с Chromeware положи chromeware-1.3.0.jar в run/mods
